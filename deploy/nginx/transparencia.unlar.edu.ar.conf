# /etc/nginx/sites-available/transparencia.unlar.edu.ar.conf
# Sitio estático: solo GET/HEAD, sin uploads ni lógica de servidor.

# OJO: no declarar directivas acá afuera (nivel http). nginx.conf de Ubuntu ya
# define algunas, como server_tokens, y repetirlas hace fallar `nginx -t`.
# Van dentro de cada server: a ese nivel sobrescriben sin duplicar.

# --- Servidor por defecto ---
# La VM tiene IP pública directa. Todo pedido que no sea para
# transparencia.unlar.edu.ar (bots que recorren IPs, dominios ajenos) se corta
# sin responder: no revelamos qué hay en el servidor.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;                       # 444 = cerrar la conexión sin respuesta
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;          # rechaza TLS si el nombre pedido no es el nuestro
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name transparencia.unlar.edu.ar;
    server_tokens off;                # no revelar la versión de nginx
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name transparencia.unlar.edu.ar;

    root /var/www/transparencia/current;
    index index.html;

    # --- TLS (wildcard institucional) ---
    ssl_certificate     /etc/ssl/unlar/fullchain.crt;   # .crt + .ca-bundle concatenados
    ssl_certificate_key /etc/ssl/unlar/unlar.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Endurecimiento ---
    server_tokens off;                # no revelar la versión de nginx
    client_max_body_size 1k;          # nadie sube nada
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # --- Headers de seguridad ---
    # OJO: un bloque location que define su propio add_header NO hereda estos.
    # Por eso se repiten en /_astro/.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # HTML: el navegador revalida en cada visita (304 si no cambió). Así, después
    # de publicar, nadie sigue viendo una versión vieja guardada en su caché.
    add_header Cache-Control "no-cache" always;

    # --- Compresión ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Rutas ---
    location / {
        try_files $uri $uri/ =404;
    }

    # Assets con hash en el nombre (los genera Astro): se pueden cachear para siempre,
    # porque si el archivo cambia, cambia su nombre.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Archivos ocultos (.git, .env, etc.), salvo .well-known
    location ~ /\.(?!well-known) { deny all; }

    error_page 404 /404.html;

    access_log /var/log/nginx/transparencia.access.log;
    error_log  /var/log/nginx/transparencia.error.log warn;
}
